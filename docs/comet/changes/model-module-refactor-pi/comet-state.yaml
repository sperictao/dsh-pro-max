    reason:
      text: ModelsView 服务行徽标/副行/行内操作/空状态与锚定菜单（分组/搜索/当前项勾选/键盘/无匹配提示）齐全，vitest
        断言列表渲染与菜单切换。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 行内操作可用：两步删除（3
      秒未确认自动还原、失焦取消）；删除默认服务后默认模型自动回退到下一个可用服务（无可用则清空）；保存首个服务且当前无默认时自动设为默认。"
    result: passed
    reason:
      text: 3 秒两步删除+失焦取消、删默认回退下一可用、首服务自动设默认均有实现与测试断言（saved.defaultProvider）。
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: 添加/编辑对话框：服务预设选择器可搜索、键盘可用，选预设自动回填路由键/名称/Base URL/协议，含"自定义端点"项（路由键命中
      pi-ai 内置目录的预设仅凭据引用必填）；字段校验（Base URL 形校验与尾部路径剥离、路由键非空）；保存门控；编辑回显现有配置。'
    result: passed
    reason:
      text: 预设选择器可搜索键盘导航+自定义端点+目录命中提示，32 预设生成物同仓，URL 剥尾/形校验与 canSave 门控在实现与测试确认。
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: 模型双栏：左栏可手动"获取列表"（成功逐条点选、全选含 indeterminate、搜索过滤、已选禁用标记、token
      缩写展示；失败按原因归类为静态文案，任何路径不含密钥值）；右栏列出已选模型可移除；端点三元组变更撤下旧结果。'
