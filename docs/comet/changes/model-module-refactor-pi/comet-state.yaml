    text: "A5: 每模型高级面板：右栏模型行可展开，编辑显示名、上下文窗口、最大输出（留空=继承，正整数校验）；推理档 chips（off..max
      多选，每启用档可编辑 wire 拼写、默认等于档名；手写 `false` 声明原样保留）；图片输入三态开关（跟随目录=不写键 / 关 /
