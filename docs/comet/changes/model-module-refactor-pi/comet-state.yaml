    source: brief.md
    text: 'A9: 配置导入：模型页"导入配置"入口扫描本机 Claude Code/Codex/OpenCode/CC Switch/Pi
      五类已知路径（缺失静默跳过不报错），按来源分组展示并分组勾选；导入把所选条目写入 settings.yaml（route
