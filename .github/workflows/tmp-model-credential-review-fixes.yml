name: Temporary Models credential review fixes

on:
  push:
    branches: [feat/models-credential-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/tmp-model-credential-review-fixes.mjs
      - name: Commit review fixes and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Models credential cutover"
          git push origin HEAD:feat/models-credential-cutover
