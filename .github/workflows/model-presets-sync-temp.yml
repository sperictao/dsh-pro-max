name: Temp model preset sync

on:
  push:
    branches: [fix/models-step4-inherited-defaults]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/models-step4-inherited-defaults
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm gen:model-presets
      - name: Apply Step 4 view patch when present
        run: |
          if [ -f scripts/step4-apply-temp.mjs ]; then
            node scripts/step4-apply-temp.mjs
          fi
      - name: Commit generated Step 4 files
        run: |
          git add src/shared/lib/model-presets.generated.ts src/features/models/ModelsView.tsx
          if git diff --cached --quiet; then
            echo "Step 4 generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(models): wire inherited models into defaults"
          git push origin HEAD:fix/models-step4-inherited-defaults
