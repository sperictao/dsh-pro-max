name: Regenerate release Cargo.lock

on:
  push:
    branches:
      - release/v0.8.23
    paths:
      - .github/workflows/regenerate-release-lock.yml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/v0.8.23
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile from manifest
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "release: regenerate Cargo.lock for v0.8.23"
          git push origin HEAD:release/v0.8.23
