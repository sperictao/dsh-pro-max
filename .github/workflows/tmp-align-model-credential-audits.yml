name: Temporary align Models credential audits

on:
  push:
    branches:
      - feat/models-credential-cutover
    paths:
      - scripts/tmp-align-model-credential-audits.mjs
      - .github/workflows/tmp-align-model-credential-audits.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Align credential audit captures
        run: node scripts/tmp-align-model-credential-audits.mjs
      - name: Commit self-cleaning audit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Align Models UI audits with credential cutover"
          git push origin HEAD:feat/models-credential-cutover
