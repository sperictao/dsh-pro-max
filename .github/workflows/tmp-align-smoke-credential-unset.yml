name: Temporary align smoke credential unset

on:
  push:
    branches:
      - fix/credential-lifecycle-removal
    paths:
      - .github/workflows/tmp-align-smoke-credential-unset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/credential-lifecycle-removal
      - name: Align smoke credential lifecycle mock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/smoke.mjs')
          s = p.read_text()
          old = '        model_credential_set: () => ({ configured: true, source: "file", writable: true }),\n        model_remote_cache_get: () => null,'
          new = '        model_credential_set: () => ({ configured: true, source: "file", writable: true }),\n        model_credential_unset: () => ({ configured: false, source: null, writable: true }),\n        model_remote_cache_get: () => null,'
          if s.count(old) != 1:
              raise SystemExit(f'expected one credential handler anchor, found {s.count(old)}')
          s = s.replace(old, new)
          old = '        "model_credential_set",\n        "model_test_connection",'
          new = '        "model_credential_set",\n        "model_credential_unset",\n        "model_test_connection",'
          if s.count(old) != 1:
              raise SystemExit(f'expected one command list anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/tmp-align-smoke-credential-unset.yml
      - name: Commit self-cleaning smoke alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.mjs .github/workflows/tmp-align-smoke-credential-unset.yml
          git commit -m "Align smoke with credential removal"
          git push origin HEAD:fix/credential-lifecycle-removal
