name: UI Audit Provider Test Connection Retry Comparison

on:
  pull_request:
    paths:
      - "e2e/capture-models-test-connection-retry-comparison.mjs"
      - ".github/workflows/ui-audit-provider-test-connection-retry-comparison.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout comparison harness
        uses: actions/checkout@v5
        with:
          ref: audit/provider-test-connection-retry-gif-comparison
          path: harness
      - name: Checkout Before (#48)
        uses: actions/checkout@v5
        with:
          ref: f1839ca0515b44617fea06e024406c3bee6aa807
          path: before
      - name: Checkout After (#50)
        uses: actions/checkout@v5
        with:
          ref: ui/provider-test-connection-retry-audit
          path: after
      - name: Overlay neutral A/B capture
        shell: bash
        run: |
          cp harness/e2e/capture-models-test-connection-retry-comparison.mjs before/e2e/
          cp harness/e2e/capture-models-test-connection-retry-comparison.mjs after/e2e/
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: before/pnpm-lock.yaml
      - name: Install baseline dependencies
        working-directory: before
        run: pnpm install --frozen-lockfile
      - name: Install fixed dependencies
        working-directory: after
        run: pnpm install --frozen-lockfile
      - name: Install Playwright video encoder
        run: pnpm dlx playwright@1.62.1 install ffmpeg
      - name: Capture Before (#48)
        working-directory: before
        env:
          AUDIT_LABEL: before
          AUDIT_PORT: 5246
        run: node e2e/capture-models-test-connection-retry-comparison.mjs
      - name: Capture After (#50)
        working-directory: after
        env:
          AUDIT_LABEL: after
          AUDIT_PORT: 5247
        run: node e2e/capture-models-test-connection-retry-comparison.mjs
      - name: Convert recordings to GIF
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y \
            -i before/.artifacts/e2e/models-test-connection-retry-comparison/before/models-test-connection-retry-before.webm \
            -vf "fps=10,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            before/.artifacts/e2e/models-test-connection-retry-comparison/before/models-test-connection-retry-before.gif
          ffmpeg -y \
            -i after/.artifacts/e2e/models-test-connection-retry-comparison/after/models-test-connection-retry-after.webm \
            -vf "fps=10,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            after/.artifacts/e2e/models-test-connection-retry-comparison/after/models-test-connection-retry-after.gif
      - name: Upload GIF comparison
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-test-connection-retry-before-after
          path: |
            before/.artifacts/e2e/models-test-connection-retry-comparison/before/
            after/.artifacts/e2e/models-test-connection-retry-comparison/after/
          if-no-files-found: warn
          retention-days: 14
