name: Temporary transient key smoke fix

on:
  push:
    branches: [feat/models-credential-cutover]
    paths:
      - .github/workflows/tmp-fix-transient-key-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
      - name: Fix transient credential assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/smoke.mjs')
          text = path.read_text()
          old = '      assert.equal(testCall.args.apiKeyEnv, "E2E_GATEWAY_API_KEY");'
          new = '      assert.equal(testCall.args.apiKeyEnv, null);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one transient apiKeyEnv assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit smoke assertion and remove temporary workflow
        run: |
          rm .github/workflows/tmp-fix-transient-key-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.mjs .github/workflows/tmp-fix-transient-key-smoke.yml
          git commit -m "Fix transient API key smoke assertion"
          git push origin HEAD:feat/models-credential-cutover
