name: Apply frontend audit follow-up patch v2

on: push

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-audit-followups
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Apply patch
        run: python .github/scripts/apply_frontend_audit_followups.py
      - name: Format touched files
        run: pnpm exec prettier --write src/shared/store/slices/market.ts src/features/market/MarketView.test.tsx src/features/models/ProviderDialog.tsx src/features/models/ProviderDialog.close.test.tsx src/features/models/readiness.ts src/features/models/readiness.test.ts src/features/models/ModelsView.tsx src/shared/commands.ts
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Focused frontend tests
        run: pnpm exec vitest run src/features/market/MarketView.test.tsx src/features/models/ProviderDialog.close.test.tsx src/features/models/readiness.test.ts
      - name: Commit verified fixes
        run: |
          rm .github/workflows/apply-frontend-audit-followups-v2.yml
          rm .github/scripts/apply_frontend_audit_followups.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(frontend): close audit follow-up gaps"
          git push origin HEAD:fix/frontend-audit-followups
