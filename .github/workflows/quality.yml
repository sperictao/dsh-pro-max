name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - name: i18n coverage
        run: node scripts/check-i18n.mjs
      - name: E2E smoke
        run: pnpm run test:e2e

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Install Linux dependencies
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "apt-get attempt ${attempt}/3"
            if timeout 240 sudo apt-get update && timeout 300 sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "apt failed or timed out, retrying in 30s..."
              sleep 30
            else
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build bundled dsh plugins
        run: pnpm run build:dsh-plugins
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # cargo test 会就地重写 ts-rs 生成物与 Cargo.lock。跑完测试必须与提交内容
      # 一致：不一致说明 Rust 结构改了却没有重新生成，前端会静默拿到过期类型；
      # 或版本号 bump 后 Cargo.lock 未同步（见 AGENTS.md 发布流程）。
      - name: Generated artifacts are in sync
        run: git diff --exit-code -- src/shared/bindings src-tauri/Cargo.lock
