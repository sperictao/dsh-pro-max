name: Dispatch v0.8.23 release

on:
  push:
    branches:
      - release/v0.8.23
    paths:
      - .github/workflows/dispatch-v0.8.23-release.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build-release at v0.8.23
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref v0.8.23
