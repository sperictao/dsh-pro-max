name: sync-release-lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Sync workspace version in Cargo.lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.lock")
          text = path.read_text()
          old = 'name = "dsh-pro-max"\nversion = "0.8.16"\n'
          new = 'name = "dsh-pro-max"\nversion = "0.8.17"\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one dsh-pro-max 0.8.16 lock entry, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/sync-release-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(release): sync Cargo.lock for 0.8.17"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
