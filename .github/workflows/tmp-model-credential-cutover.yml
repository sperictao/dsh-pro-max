name: Temporary Models credential cutover

on:
  push:
    branches: [feat/models-credential-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply credential cutover
        run: node scripts/tmp-model-credential-cutover.mjs
      - name: Commit product changes and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cut Models UI over to DSH credentials"
          git push origin HEAD:feat/models-credential-cutover
