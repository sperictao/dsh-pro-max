name: Temporary cache expectation smoke fix

on:
  push:
    branches: [feat/models-credential-cutover]
    paths:
      - .github/workflows/tmp-fix-cache-expectation-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
      - name: Remove stale cache invocation expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/smoke.mjs')
          text = path.read_text()
          old = '        "model_remote_cache_get",\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one cache invocation expectation, got {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
      - name: Commit smoke fix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-fix-cache-expectation-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.mjs .github/workflows/tmp-fix-cache-expectation-smoke.yml
          git commit -m "Remove stale cache smoke expectation"
          git push origin HEAD:feat/models-credential-cutover
