name: release-bootstrap-v0.8.19

on:
  push:
    branches:
      - release/v0.8.19

permissions:
  contents: write
  actions: write

jobs:
  finalize-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/v0.8.19
          fetch-depth: 0

      - name: Sync Cargo.lock workspace version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/Cargo.lock")
          text = path.read_text()
          old = '[[package]]\nname = "dsh-pro-max"\nversion = "0.8.18"\n'
          new = '[[package]]\nname = "dsh-pro-max"\nversion = "0.8.19"\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one dsh-pro-max 0.8.18 lock entry, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/release-bootstrap-v0.8.19.yml

      - name: Validate release prerequisites
        run: node scripts/check-release.mjs --tag v0.8.19

      - name: Commit final release state and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/release-bootstrap-v0.8.19.yml
          git commit -m "chore: finalize v0.8.19 release"
          git tag -a v0.8.19 -m "v0.8.19"
          git push origin HEAD:release/v0.8.19
          git push origin v0.8.19

      - name: Dispatch official release workflow at tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-release.yml --ref v0.8.19
