name: UI Audit Custom Endpoint

on:
  pull_request:
    paths:
      - "src/features/models/**"
      - "e2e/capture-models-custom-endpoint.mjs"
      - ".github/workflows/ui-audit-custom-endpoint.yml"
  workflow_dispatch:

jobs:
  custom-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Install Playwright video encoder
        run: pnpm dlx playwright@1.62.1 install ffmpeg
      - name: Capture Custom endpoint flow
        run: node e2e/capture-models-custom-endpoint.mjs
      - name: Convert recording to GIF
        run: pnpm dlx playwright@1.62.1 ffmpeg -y -i .artifacts/e2e/models-custom-endpoint/models-custom-endpoint.webm -vf "fps=10,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" .artifacts/e2e/models-custom-endpoint/models-custom-endpoint.gif
      - uses: actions/upload-artifact@v4
        with:
          name: ui-audit-models-custom-endpoint
          path: .artifacts/e2e/models-custom-endpoint/
          retention-days: 14
