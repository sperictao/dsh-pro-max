name: UI Audit Service Picker

on:
  pull_request:
    paths:
      - "src/features/models/**"
      - "src/shared/lib/model-presets.generated.ts"
      - "e2e/capture-models-service-picker.mjs"
      - ".github/workflows/ui-audit-service-picker.yml"
  workflow_dispatch:

jobs:
  service-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Run service picker tests
        run: pnpm vitest run src/features/models/ProviderDialog.picker.test.tsx src/features/models/ProviderDialog.add.test.tsx
      - name: Install Playwright video encoder
        run: pnpm dlx playwright@1.62.1 install ffmpeg
      - name: Capture service picker flow
        run: node e2e/capture-models-service-picker.mjs
      - name: Convert recording to GIF
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y \
            -i .artifacts/e2e/models-service-picker/models-service-picker.webm \
            -vf "fps=10,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            .artifacts/e2e/models-service-picker/models-service-picker.gif
      - uses: actions/upload-artifact@v4
        with:
          name: ui-audit-models-service-picker
          path: .artifacts/e2e/models-service-picker/
          if-no-files-found: error
          retention-days: 14
