name: Fix service picker pointer activation

on: pull_request

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/frontend-audit-followups
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - name: Apply pointer activation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/features/models/ProviderDialog.tsx")
          text = path.read_text()
          old = "onMouseEnter={() => setHighlighted("
          new = "onMouseMove={() => setHighlighted("
          if text.count(old) != 2:
              raise SystemExit(f"expected 2 picker hover handlers, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
      - name: TypeScript and picker tests
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run src/features/models/ProviderDialog.picker.test.tsx src/features/models/ProviderDialog.add.test.tsx src/features/models/ProviderDialog.close.test.tsx
      - name: Verify service picker audit flow
        run: |
          pnpm dlx playwright@1.62.1 install ffmpeg
          node e2e/capture-models-service-picker.mjs
      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-service-picker-pointer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(models): ignore incidental picker hover on open"
          git push origin HEAD:fix/frontend-audit-followups
