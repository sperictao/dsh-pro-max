name: Temporary credential lifecycle acceptance patch

on:
  push:
    branches:
      - fix/credential-lifecycle-removal
    paths:
      - scripts/tmp-credential-lifecycle-acceptance.mjs
      - .github/workflows/tmp-credential-lifecycle-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/credential-lifecycle-removal
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply credential lifecycle patch
        run: node scripts/tmp-credential-lifecycle-acceptance.mjs
      - name: Commit self-cleaning lifecycle changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Complete API key credential lifecycle"
          git push origin HEAD:fix/credential-lifecycle-removal
