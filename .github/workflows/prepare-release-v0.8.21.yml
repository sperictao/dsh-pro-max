name: prepare-release-v0.8.21

on:
  push:
    branches:
      - release/v0.8.21

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync Cargo.lock workspace version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src-tauri/Cargo.lock')
          text = path.read_text()
          old = 'name = "dsh-pro-max"\nversion = "0.8.20"'
          new = 'name = "dsh-pro-max"\nversion = "0.8.21"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Cargo.lock workspace version match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate release prerequisites
        run: node scripts/check-release.mjs --tag v0.8.21

      - name: Commit finalized release branch
        run: |
          rm .github/workflows/prepare-release-v0.8.21.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/prepare-release-v0.8.21.yml
          git commit -m "Release v0.8.21"
          git push origin HEAD:release/v0.8.21
