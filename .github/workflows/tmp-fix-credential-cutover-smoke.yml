name: Temporary credential cutover smoke fix

on:
  push:
    branches: [feat/models-credential-cutover]
    paths:
      - scripts/tmp-fix-credential-cutover-smoke.mjs
      - .github/workflows/tmp-fix-credential-cutover-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/models-credential-cutover
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch E2E smoke credential contract
        run: node scripts/tmp-fix-credential-cutover-smoke.mjs
      - name: Commit smoke fix and remove temporary patcher
        run: |
          rm scripts/tmp-fix-credential-cutover-smoke.mjs
          rm .github/workflows/tmp-fix-credential-cutover-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.mjs scripts/tmp-fix-credential-cutover-smoke.mjs .github/workflows/tmp-fix-credential-cutover-smoke.yml
          git commit -m "Align E2E smoke with credential cutover"
          git push origin HEAD:feat/models-credential-cutover
